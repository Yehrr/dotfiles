[notification]
layer = "overlay"
max_visible = 3

[osd]
offset_y = 150
position = "bottom_center"
position_vertical = "bottom_center"
scale = 1.2000000104308128

    [osd.kinds]
    bluetooth = false
    brightness = false
    caffeine = false
    dnd = false
    keyboard_backlight = false
    keyboard_layout = false
    media = false
    nightlight = false
    power_profile = false
    privacy = false
    volume_input = false
    wifi = false

[shell.launcher]
categories = false
default_view = "all"
show_session_button = false
show_settings_button = false

[shell.panel]
control_center_placement = "floating"
open_near_click_control_center = true

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/yehr/dotfiles/themes/wallpapers"

    [wallpaper.default]
    path = "/home/yehr/dotfiles/themes/wallpapers/221.png"

    [wallpaper.last]
    path = "/home/yehr/dotfiles/themes/wallpapers/221.png"

    [wallpaper.monitors.DP-1]
    path = "/home/yehrol/dotfiles/esthetic/wallpapers/221.png"

    [wallpaper.monitors.DP-2]
    path = "/home/yehrol/dotfiles/esthetic/wallpapers/221.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/yehr/dotfiles/themes/wallpapers/221.png"

[weather]
enabled = false

[widget.DISK]
stat = "disk_free"
type = "sysmon"
visualization = "none"

[widget.clock]
format = "{:%H:%M, %d %B %Y}"

[widget.control-center]
glyph = "navigation-filled"

[widget.cpu]
visualization = "none"

[widget.media]
artist_first = true
hide_when_no_media = true
max_length = 350
rotate_album_art = true
show_progress = true
title_scroll = "on_hover"

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.sysmon]
stat = "ram_pct"
visualization = "none"

[widget.tray]
detached_panel = true
drawer = true
drawer_columns = 5
pinned = [
    "Nextcloud",
    "Vesktop",
    "KeePassXC",
    "net.lutris.Lutris",
    "steam",
    "Ankama Launcher1",
    "udiskie",
    "qBittorrent",
    "flameshot"
]

[widget.volume.actions]
scroll_down = "volume-down 2"
scroll_up = "volume-up 2"

[widget.workspaces]
font_weight = 800
scale = 1.1000000000000001